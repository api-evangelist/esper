aid: esper
name: Esper
description: >-
  Esper is the DevOps platform for connected devices, providing cloud-based
  Android (and edge) device management, application deployment, and remote
  orchestration for dedicated-device fleets. The Esper Manage REST API lets
  developers programmatically provision, monitor, and control Android-based
  dedicated devices running the Esper agent: manage devices and device groups,
  upload and roll out applications and versions, run device and group commands,
  configure compliance and enterprise policies, set up geofences, manage
  content, and subscribe to device events via webhooks. APIs are authenticated
  with a Bearer API key and served per-tenant on a dedicated Esper Cloud
  environment, with an official Python SDK (esperclient) and CLI.
url: https://raw.githubusercontent.com/api-evangelist/esper/refs/heads/main/apis.yml
