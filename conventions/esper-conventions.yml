base_url:
  pattern: https://<domain>-api.esper.cloud/api
  notes: >-
    Per-tenant base URL; `<domain>` is the subdomain chosen at Esper Dev signup.
    Enterprise-scoped resources live under /enterprise/<enterprise_id>/.
pagination:
  style: limit-offset
  params:
    limit: Number of results to return per page (default 20)
    offset: Initial index from which to return results (default 0)
  response_fields:
    count: Total number of results
    next: URL of the next page (nullable)
    previous: URL of the previous page (nullable)
    results: Array of result objects
idempotency:
  supported: false
  notes: No idempotency-key contract is documented in the spec or developer docs.
versioning:
  style: resource-suffix
  notes: >-
    Versioning is expressed per resource family rather than a global path prefix
    (e.g. Application vs Application V1; Commands vs Commands V2). Commands V2
    adds queuing, offline-device support and command history.
error_envelope:
