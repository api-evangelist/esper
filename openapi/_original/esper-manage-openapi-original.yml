        type: string
      days:
        type: array
        items:
          type: string
  V0CommandScheduleArgsTimeTypeEnum:
    type: string
    description: 'The Time-Type argument, in Schedule args, is to indicate which timezone the Command Framework should utilize when scheduling the command.

      Following Schedule Args for Time-Type are supported:


      ```

      * CONSOLE: Use the local timezone of the user creating the schedule.

      * DEVICE: Use the local timezone of the device, to which the command is issued, wherever it may be.

      ```

      '
    enum:
    - console
    - device
  V0CommandScheduleEnum:
    type: string
    description: 'Following Schedule types are supported


      ```

      * IMMEDIATE: Schedule the command to execcute Immediately

      * WINDOW: Schedule the command to execute within the given window

      * RECURRING: Schedule the command to execute repeatedly, within given parameters

      ```

      '
    enum:
    - IMMEDIATE
    - WINDOW
    - RECURRING
  V0CommandStatus:
    type: object
    properties:
      id:
        title: Id
        description: Unique command identifier
        type: string
        format: uuid
        readOnly: true
      request:
        title: Request Id
        description: Request Id associated with this command
        type: string
        format: uuid
        readOnly: true
      device:
        title: Device
        description: Device associated with this command
        type: string
        format: url
        readOnly: true
      state:
        type: string
        description: Current state of the command
        enum:
        - Command Queued
        - Command Initiated
        - Command Acknowledged
        - Command In Progress
        - Command TimeOut
        - Command Success
        - Command Failure
        - Command Scheduled
        - Command Cancelled
      reason:
        type: string
        description: details briefing the reason for current command state
      created_on:
        title: Created on
        description: Timestamp of command creation
        type: string
        format: date-time
        readOnly: true
      updated_on:
        title: Updated on
        description: Last updated timestamp of command
        type: string
        format: date-time
        readOnly: true
  V0DeviceCommandEnum:
    type: string
    description: "Following commands are supported\n\n```\n* ADD_TO_WHITELIST: Whitelist an installed sytem app. Requires `package_name` in command arguments where `package_name` is the app package uploaded on Esper \n* ADD_WIFI_AP : Add wifi access points for device. Requires `wifi_access_points` in command arguments where `wifi_access_points` is the data with access points\n* CLEAR_APP_DATA : Clear data for an installed app. Requires `package_name` in command arguments where `package_name` is the app package uploaded on Esper \n* INSTALL: Install an app on a device. Requires `app_version` in command arguments where `app_version` is the version id of app uploaded on Esper\n* LOCK: Lock device screen\n* REBOOT: Reboot a device\n* REMOVE_FROM_WHITELIST : Remove an installed system app from whitelist. Requires `package_name` in command arguments where `package_name` is the app package uploaded on Esper \n* REMOVE_WIFI_AP : Remove Wifi access points for device. Requires `wifi_access_points` in command arguments where `wifi_access_points` is the data with access points\n* SET_APP_PERMISSION : Set permission for an installed app. Requires `package_name`, `grant_state`, `permission` in command arguments where `package_name` is the app package uploaded on Esper, `grant_state` should be \"PERMISSION_GRANT_STATE_DEFAULT\", \"PERMISSION_GRANT_STATE_DENIED\", \"PERMISSION_GRANT_STATE_GRANTED\" and `permission` is a valid permission\n* SET_APP_STATE : Set the state of an app - SHOW/HIDE/DISABLE. Requries `app_state` and `package_name` in command arguments where `app_state` is the state of app and `package_name` is the app package uploaded on Esper\n* SET_BLUETOOTH_STATE : Set bluetooth state (ON/OFF) for device. Requires `bluetooth_state` in command arguments where `bluetooth_state` is a boolean.\n* SET_BRIGHTNESS_SCALE : Set brightness for device. Requires `brightness_value` in command arguments where `brightness_value` is an integer (1-100).\n* SET_DEVICE_LOCKDOWN_STATE : Set lockdown state for a device. Requires `state` and `message` in command arguments where `state` is LOCKED/UNLOCKED and `message` is the message to be added with command\n* SET_GPS_STATE :Set the GPS state for a device. Requires `gps_state` in command arguments where `gps_state` should be either 0, 1, 2, 3 or 4 (LOCATION_MODE_HIGH_ACCURACY = 0, LOCATION_MODE_SENSORS_ONLY = 1, LOCATION_MODE_BATTERY_SAVING = 2, LOCATION_MODE_OFF = 3, LOCATION_MODE_ON = 4)\n* SET_KIOSK_APP : Command to set the Kiosk app for a device. Requires `package_name` in command arguments where `package_name` is the app package uploaded on Esper  \n* SET_NEW_POLICY : Apply policy on device. Requires `policy_url` in command arguments where `policy_url` is the URL to the policy \n* SET_ROTATION_STATE : Set screen orientation. Requires `rotate_state` in command arguments where `rotate_state` should be either 0, 1 or 2 (0 = AUTO, 1 = PORTRAIT_ONLY, 2 = LANDSCAPE_ONLY)\n* SET_SCREEN_OFF_TIMEOUT: Set screen off timeout for a device. Requires `screen_off_timeout` in command arguments where `screen_off_timeout` should be either -1 or between 5000 and 1800000\n* SET_STREAM_VOLUME : Set strema volume for a device. Requires `stream` and `volume_level` in command arguments where `stream` should be either 0(Ring), 1(Notification), 2(Alarm) or 3(Music) and `volume_level` should be a value from 0 to 100\n* SET_TIMEZONE : Set the timezone for a device. Requires `timezone_string` in command arguments where `timezone_string` is a valid string representing the timezone\n* SET_WIFI_STATE : Set the wifi state (ON/OFF) for a device. Requires `wifi_state` in command arguments where `wifi_state` is a boolean. \n* UNINSTALL: Uninstall an app from device. Requires `package_name` in command arguments where `package_name` is the app package uploaded on Esper\n* UPDATE_DEVICE_CONFIG: Push additional configurations to the Device\n* UPDATE_HEARTBEAT: Ping a device\n* UPDATE_LATEST_DPC : Prompt device to update the DPC app to the latest versions.\n* WIPE : Wipes the device.\n```\n"
    enum:
    - ADD_TO_WHITELIST
    - ADD_WIFI_AP
    - CLEAR_APP_DATA
    - INSTALL
    - LOCK
    - REBOOT
    - REMOVE_FROM_WHITELIST
    - REMOVE_WIFI_AP
    - SET_APP_PERMISSION
    - SET_APP_STATE
    - SET_BLUETOOTH_STATE
    - SET_BRIGHTNESS_SCALE
    - SET_DEVICE_LOCKDOWN_STATE
    - SET_GPS_STATE
    - SET_KIOSK_APP
    - SET_NEW_POLICY
    - SET_ROTATION_STATE
    - SET_SCREEN_OFF_TIMEOUT
    - SET_STREAM_VOLUME
    - SET_TIMEZONE
    - SET_WIFI_STATE
    - UNINSTALL
    - UPDATE_DEVICE_CONFIG
    - UPDATE_HEARTBEAT
    - UPDATE_LATEST_DPC
    - WIPE
