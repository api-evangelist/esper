definitions:
  AppInstall:
    required:
    - application
    - install_state
    - enterprise
    - device
    type: object
    properties:
      id:
        title: Id
        type: string
        format: uuid
        readOnly: true
      application:
        $ref: '#/definitions/AppInstallApplication'
      install_state:
        $ref: '#/definitions/AppInstallStateEnum'
      reason_details:
        title: Reason details
        type: string
        minLength: 1
        x-nullable: true
      created_on:
        title: Created on
        type: string
        format: date-time
        readOnly: true
      updated_on:
        title: Updated on
        type: string
        format: date-time
        readOnly: true
      is_active:
        title: Is active
        type: boolean
      enterprise:
        title: Enterprise
        type: string
        format: url
      device:
        title: Device
        type: string
        format: url
  AppInstallApplication:
    title: Application
    type: object
    properties:
      application_name:
        title: Application name
        type: string
      package_name:
        title: Package name
        type: string
      version:
        $ref: '#/definitions/AppInstallVersion'
      is_enabled:
        title: Is enabled
        type: boolean
  AppInstallStateEnum:
    title: Install state
    type: string
    description: 'Device App Install State


      ``` * NOT_INSTALLED = "Not Installed"

      * INSTALL_IN_PROGRESS = "Installation In-Progress"

      * UNINSTALL_IN_PROGRESS = "Uninstallation In-Progress"

      * INSTALL_SUCCESS = "Install Success"

      * INSTALL_FAILED = "Install Failed"

      * UNINSTALL_SUCCESS = "Uninstall Success"

      * UNINSTALL_FAILED = "Uninstall Failed"

      ```

      '
    enum:
    - NOT_INSTALLED
    - INSTALL_IN_PROGRESS
    - UNINSTALL_IN_PROGRESS
    - INSTALL_SUCCESS
    - INSTALL_FAILED
    - UNINSTALL_SUCCESS
    - UNINSTALL_FAILED
  AppInstallVersion:
    title: Version
    type: object
    properties:
      app_version_id:
        title: App version id
        type: string
