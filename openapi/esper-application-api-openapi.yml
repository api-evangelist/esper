openapi: 3.2.0
info:
  description: '# Introduction

    Esper APIs are a set of REST-based APIs that help you programmatically control and monitor Android-based Dedicated Devices running the Esper agent using Esper Manage.'
  version: 1.0.0
  title: ESPER API REFERENCE Application API
  termsOfService: https://esper.io/terms-of-service
  contact:
    email: developer@esper.io
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
- url: https://foo-api.esper.cloud/api
tags:
- name: Application
  description: APIs for application management
  externalDocs:
    description: Find out more about application management
    url: https://docs.esper.io/home/console.html#apps
paths:
  /enterprise/{enterprise_id}/application/:
    parameters:
    - name: enterprise_id
      description: A UUID string identifying this enterprise.
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getAllApplications
      summary: List apps in enterprise
      description: Returns Application list
      parameters:
      - name: application_name
        in: query
        description: filter by application name
        required: false
        schema:
          type: string
      - name: package_name
        in: query
        description: filter by package name
        required: false
        schema:
          type: string
      - name: package_name_exact
        in: query
        description: filter by package name (exact match)
        required: false
        schema:
          type: string
      - name: has_uploaded_version
        in: query
        description: Returns applications having atleast on version uploaded
        required: false
        schema:
          type: boolean
      - name: category
        in: query
        description: filter by category
        required: false
        schema:
          type: string
      - name: supported_sdk
        in: query
        description: filter by supported sdk versions
        required: false
        schema:
          type: integer
      - name: is_active
        in: query
        description: filter by active applications
        required: false
        schema:
          type: boolean
      - name: is_hidden
        in: query
        description: filter default esper apps
        required: false
        schema:
          type: boolean
          default: false
      - name: created_on_gt
        in: query
        description: filter applications created after a given timestamp
        required: false
        schema:
          type: string
          format: datetime
      - name: created_on_lt
        in: query
        description: filter applications created before a given timestamp
        required: false
        schema:
          type: string
          format: datetime
      - name: updated_on_gt
        in: query
        description: filter applications updated after a given timestamp
        required: false
        schema:
          type: string
          format: datetime
      - name: updated_on_lt
        in: query
        description: filter applications updated before a given timestamp
        required: false
        schema:
          type: string
          format: datetime
      - name: limit
        in: query
        description: Number of results to return per page.
        required: false
        schema:
          type: integer
          default: 20
      - name: offset
        in: query
        description: The initial index from which to return the results.
        required: false
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                required:
                - count
                - results
                type: object
                properties:
                  count:
                    type: integer
                  next:
                    type:
                    - string
                    - 'null'
                    format: url
                  previous:
                    type:
                    - string
                    - 'null'
                    format: url
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Application'
        '401':
          description: Authorization information is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - apiKey: []
      tags:
      - Application
  /enterprise/{enterprise_id}/application/upload/:
    parameters:
    - name: enterprise_id
      description: A UUID string identifying this enterprise.
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: upload
      summary: Upload an application to enterprise
      description: Returns application
      responses:
        '201':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  application:
                    $ref: '#/components/schemas/Application'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authorization information is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden, no permission to perform this action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Unsupported media type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - apiKey: []
      tags:
      - Application
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                app_file:
                  type: string
                  description: Valid APK file
                  format: binary
              required:
              - app_file
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                app_file:
                  type: string
                  description: Valid APK file
                  format: binary
              required:
              - app_file
  /enterprise/{enterprise_id}/application/{application_id}/:
    parameters:
    - name: application_id
      in: path
      description: A UUID string identifying this application.
      required: true
      schema:
        type: string
        format: uuid
    - name: enterprise_id
      description: A UUID string identifying enterprise.
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getApplication
      summary: Get application information
      description: Returns Application instance
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '401':
          description: Authorization information is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - apiKey: []
      tags:
      - Application
    delete:
      operationId: deleteApplication
      summary: Delete an application
      description: Empty response
      responses:
        '204':
          description: The resource was deleted successfully.
        '401':
          description: Authorization information is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden, no permission to perform this action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - apiKey: []
      tags:
      - Application
  /enterprise/{enterprise_id}/application/{application_id}/version/:
    parameters:
    - name: application_id
      in: path
      description: A UUID string identifying this application.
      required: true
      schema:
        type: string
        format: uuid
    - name: enterprise_id
      description: A UUID string identifying enterprise.
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getAppVersions
      summary: List App versions
      description: Returns AppVersion list
      parameters:
      - name: version_code
        in: query
        description: filter by version code
        required: false
        schema:
          type: string
      - name: build_number
        in: query
        description: filter by build number
        required: false
        schema:
          type: string
      - name: is_g_play
        in: query
        description: filter google play applications
        required: false
        schema:
          type: boolean
      - name: approval_status
        in: query
        description: filter by approval status
        required: false
        schema:
          type: string
          enum:
          - AVAILABLE
          - ACCEPTED
          - APPROVED
          - REJECTED
      - name: is_enabled
        in: query
        description: filter by enabled versions
        required: false
        schema:
          type: boolean
      - name: is_default
        in: query
        description: filter by default versions
        required: false
        schema:
          type: boolean
      - name: created_on_gt
        in: query
        description: filter applications created after a given timestamp
        required: false
        schema:
          type: string
          format: datetime
      - name: created_on_lt
        in: query
        description: filter applications created before a given timestamp
        required: false
        schema:
          type: string
          format: datetime
      - name: updated_on_gt
        in: query
        description: filter applications updated after a given timestamp
        required: false
        schema:
          type: string
          format: datetime
      - name: updated_on_lt
        in: query
        description: filter applications updated before a given timestamp
        required: false
        schema:
          type: string
          format: datetime
      - name: limit
        in: query
        description: Number of results to return per page.
        required: false
        schema:
          type: integer
          default: 20
      - name: offset
        in: query
        description: The initial index from which to return the results.
        required: false
        schema:
          type: integer
          default: 0
      - name: ordering
        in: query
        description: 'Order result set by field name.


          ```

          * installed_count: order by asc

          * -installed_count: order by desc

          ```

          '
        required: false
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                required:
                - count
                - results
                type: object
                properties:
                  count:
                    type: integer
                  next:
                    type:
                    - string
                    - 'null'
                    format: url
                  previous:
                    type:
                    - string
                    - 'null'
                    format: url
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/AppVersion'
        '401':
          description: Authorization information is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - apiKey: []
      tags:
      - Application
  /enterprise/{enterprise_id}/application/{application_id}/version/{version_id}/:
    parameters:
    - name: version_id
      in: path
      description: A UUID string identifying this app version.
      required: true
      schema:
        type: string
        format: uuid
    - name: application_id
      in: path
      description: A UUID string identifying this application.
      required: true
      schema:
        type: string
        format: uuid
    - name: enterprise_id
      description: A UUID string identifying enterprise.
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getAppVersion
      summary: Get app version information
      description: Returns AppVersion instance
      parameters:
      - name: request_id
        in: query
        description: If this value exists in cache, delete the application and cache entry.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppVersion'
        '401':
          description: Authorization information is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - apiKey: []
      tags:
      - Application
    delete:
      operationId: deleteAppVersion
      summary: Delete app version
      description: Empty response
      responses:
        '200':
          description: No request id is provided and the application is linked to one or more templates. Returns a request_id. Call with this request id to delete the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppVersionDelete'
        '204':
          description: The resource was deleted successfully.
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authorization information is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden, no permission to perform this action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - apiKey: []
      tags:
      - Application
    patch:
      operationId: patchAppVersion
      summary: Patch an App version instance
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppVersion'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authorization information is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden, no permission to perform this action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - apiKey: []
      tags:
      - Application
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                release_name:
                  title: Release name
                  description: Name of the Release
                  type: string
                release_comments:
                  title: Release comments
                  description: Additional comments about the release
                  type: string
                release_track:
                  title: Release track
                  description: Description of the content
                  type: string
                  enum:
                  - Alpha
                  - Beta
                  - Production
                is_enabled:
                  title: Is Enabled
                  description: Is the app version enabled
                  type: boolean
                min_sdk_version:
                  title: Minimum SDK version
                  description: Version number of minimum SDK version that supports this app version
                  type: string
                target_sdk_version:
                  title: Target SDK version
                  description: Target SDK version that supports this app version
                  type: string
                build_number:
                  title: Build Number
                  description: Build number of this app version
                  type: string
                version_code:
                  title: Version Code
                  description: Verion code of this app version
                  type: string
                approval_status:
                  title: Approval Status
                  description: Approval status of this app version
                  type: string
                  enum:
                  - AVAILABLE
                  - ACCEPTED
                  - APPROVED
                  - REJECTED
                is_default:
                  title: Is default
                  description: Is the app version default
                  type: boolean
  /enterprise/{enterprise_id}/application/{application_id}/version/{version_id}/installdevices:
    parameters:
    - name: version_id
      in: path
      description: A UUID string identifying this app version.
      required: true
      schema:
        type: string
        format: uuid
    - name: application_id
      in: path
      description: A UUID string identifying this application.
      required: true
      schema:
        type: string
        format: uuid
    - name: enterprise_id
      description: A UUID string identifying enterprise.
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getInstallDevices
      summary: List install devices
      description: Returns list of devices with the specified app version installed
      parameters:
      - name: search
        in: query
        description: A search term, search based on device name, device alias_name, group name
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Number of results to return per page
        required: false
        schema:
          type: integer
      - name: offset
        in: query
        description: The initial index from which to return the results
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                required:
                - count
                - results
                type: object
                properties:
                  count:
                    type: integer
                  next:
                    type:
                    - string
                    - 'null'
                    format: url
                  previous:
                    type:
                    - string
                    - 'null'
                    format: url
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/InstallDevices'
        '401':
          description: Authorization information is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden, no permission to perform this action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - apiKey: []
      tags:
      - Application
  /v1/enterprise/{enterprise_id}/application/{application_id}/version/{version_id}/installdevices:
    parameters:
    - name: version_id
      in: path
      description: A UUID string identifying this app version.
      required: true
      schema:
        type: string
        format: uuid
    - name: application_id
      in: path
      description: A UUID string identifying this application.
      required: true
      schema:
        type: string
        format: uuid
    - name: enterprise_id
      description: A UUID string identifying enterprise.
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getInstallDevicesV1
      summary: List install devices
      description: Returns list of devices with the specified app version installed
      parameters:
      - name: search
        in: query
        description: A search term, search based on device name, device alias_name, group name
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Number of results to return per page
        required: false
        schema:
          type: integer
      - name: offset
        in: query
        description: The initial index from which to return the results
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                required:
                - count
                - results
                type: object
                properties:
                  count:
                    type: integer
                  next:
                    type:
                    - string
                    - 'null'
                    format: url
                  previous:
                    type:
                    - string
                    - 'null'
                    format: url
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/InstallDevices'
        '401':
          description: Authorization information is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden, no permission to perform this action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - apiKey: []
      tags:
      - Application
components:
  schemas:
    InstallDevices:
      required:
      - id
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
        device_name:
          title: Device name
          type: string
        alias_name:
          title: alias name
          type:
          - string
          - 'null'
        group_name:
          title: Group name
          type: string
          maxLength: 255
          minLength: 1
    AppVersion:
      title: Application Version
      required:
      - permissions
      - version_code
      - enterprise
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
          readOnly: true
        installed_count:
          title: Installed count
          type: integer
          readOnly: true
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/AppPermission'
        app_file:
          title: App file
          type: string
          readOnly: true
          format: url
        app_icon:
          title: App icon
          type:
          - string
          - 'null'
          readOnly: true
          format: url
        version_code:
          title: Version code
          type: string
          maxLength: 50
          minLength: 1
        build_number:
          title: Build number
          type:
          - string
          - 'null'
          maxLength: 100
          minLength: 1
        size_in_mb:
          title: Size in mb
          type: number
        hash_string:
          title: Hash string
          type: string
        release_name:
          title: Release name
          type:
          - string
          - 'null'
          maxLength: 255
          minLength: 1
        release_comments:
          title: Release comments
          type:
          - string
          - 'null'
          minLength: 1
        release_track:
          title: Release track
          type:
          - string
          - 'null'
          enum:
          - Alpha
          - Beta
          - Production
        created_on:
          title: Created on
          type: string
          format: date-time
          readOnly: true
        updated_on:
          title: Updated on
          type: string
          format: date-time
          readOnly: true
        min_sdk_version:
          title: Min sdk version
          type:
          - string
          - 'null'
          maxLength: 10
          minLength: 1
        target_sdk_version:
          title: Target sdk version
          type:
          - string
          - 'null'
          maxLength: 10
          minLength: 1
        is_enabled:
          title: Is enabled
          type: boolean
        enterprise:
          title: Enterprise
          type: string
          format: url
        application:
          title: Application
          type: string
          format: url
        approval_status:
          title: Application status
          type: string
          enum:
          - AVAILABLE
          - ACCEPTED
          - APPROVED
          - REJECTED
    ErrorResponse:
      type: object
      properties:
        errors:
          title: Messages describing the error
          type: array
          items:
            type: string
        message:
          title: Message describing the error
          type: string
        status:
          title: alias name
          type: integer
    AppPermission:
      required:
      - permission
      - enterprise
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
          readOnly: true
        permission:
          title: Permission
          type: string
          maxLength: 255
          minLength: 1
        grant_state:
          title: Grant state
          type: string
          enum:
          - Default
          - Denied
          - Granted
        created_on:
          title: Created on
          type: string
          format: date-time
          readOnly: true
        updated_on:
          title: Updated on
          type: string
          format: date-time
          readOnly: true
        is_active:
          title: Is active
          type: boolean
        enterprise:
          title: Enterprise
          type: string
          format: url
        app_version:
          title: App version
          type: string
          format: url
    AppVersionDelete:
      type: object
      properties:
        request_id:
          title: Request id
          type: string
          format: uuid
        templates:
          description: List of linked templates to an app version
          type: array
          items:
            type: object
            properties:
              id:
                title: Id
                description: Id of the linked template
                type: integer
              name:
                title: Name
                description: Name of the linked template
                type: string
    ApplicationVersion:
      title: Version
      type: object
      properties:
        id:
          title: Id
          type: string
          format: uuid
          readOnly: true
        version_code:
